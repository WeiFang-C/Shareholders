<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fang.co.com · 工具入口</title>
<style>
  :root{
    --paper:#F6F4EE; --ink:#232320; --ink-muted:#726F63;
    --navy:#2B3F4F; --navy-soft:#3F5A6E; --hairline:#DAD5C8;
    --font-serif:'Source Serif 4', Georgia, serif;
    --font-sans:'Inter', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);}
  .wrap{max-width:640px;margin:0 auto;padding:60px 24px;}
  h1{font-family:var(--font-serif);font-size:22px;font-weight:600;margin:0 0 6px 0;}
  p.sub{color:var(--ink-muted);font-size:13px;margin:0 0 32px 0;}
  .list{border:1px solid var(--hairline);border-radius:6px;overflow:hidden;background:#fff;}
  .item{display:block;padding:16px 18px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--hairline);}
  .item:last-child{border-bottom:none;}
  .item:hover{background:#F1EEE3;}
  .item .name{font-weight:600;font-size:14.5px;}
  .item .desc{font-size:12.5px;color:var(--ink-muted);margin-top:3px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>工具入口</h1>
  <p class="sub">fang.co.com</p>
  <div class="list">
    <a class="item" href="/uc/">
      <div class="name">投資配息紀錄－UC</div>
      <div class="desc">股東出資與配息紀錄（唯讀快照）</div>
    </a>
  </div>
</div>
</body>
</html>
